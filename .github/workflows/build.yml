name: Nova Indir Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Find source ZIP
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "Source ZIP bulunamadi."
            exit 1
          fi

          echo "Source ZIP: $ZIP"
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract source
        shell: bash
        run: |
          set -e

          mkdir -p source

          unzip -q "$SOURCE_ZIP" -d source

          echo "Extract edilen dosyalar:"
          find source -maxdepth 3 -type f | head -100

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT="$(find "$GITHUB_WORKSPACE/source" \
            -name gradlew \
            -type f \
            -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "gradlew bulunamadi."
            echo "ZIP Android kaynak projesi icermiyor olabilir."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android proje dizini:"
          echo "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew clean --no-daemon --stacktrace --console=plain

      - name: Build Independent Pro Debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleIndependentProDebug -PNOVA_APK_SPLITS=true --no-daemon --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Indir-Independent-Pro-Debug
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
