name: Nova Indir Full Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Nova-Indir-Checkpoint-052-Lite-Pro-Play-Independent-Final.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: nova-indir-full-build
  cancel-in-progress: false

jobs:
  build:
    name: Nova Indir Lite + Pro + Play + Independent
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SOURCE_ZIP: Nova-Indir-Checkpoint-052-Lite-Pro-Play-Independent-Final.zip
      EXPECTED_SHA256: ad4af671b416301b7cf78105bb786e513875e0d5195fa4308959bd5eed2afbe0
      GRADLE_OPTS: -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SHA-256 source verification
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::Hedef ZIP dosyası ($SOURCE_ZIP) ana dizinde bulunamadı!"
            exit 1
          fi
          ACTUAL_SHA256="$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Source ZIP SHA-256 dogrulamasi basarisiz."
            exit 1
          fi
          echo "SHA-256 dogrulama BASARILI."

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          mkdir -p source
          unzip -q "$SOURCE_ZIP" -d source
          echo "Kaynak ZIP acildi."

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/source" -name gradlew -type f -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android projesi bulunamadi."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: source.ready
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          chmod +x "$PROJECT_DIR/gradlew"
          echo "source.ready"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build All Test APKs
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          # İmza ve Play Store kısıtlamalarına takılmayan Test APK oluşturma görevleri tetikleniyor
          ./gradlew :app:assembleNovaIndependentDebug :app:assembleNovaPlayDebug --no-daemon --max-workers=2 --stacktrace --console=plain

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Indir-Test-APKs
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/
          if-no-files-found: error
          retention-days: 30
