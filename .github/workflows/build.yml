name: Nova İndir Full Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Nova-Indir-main_Checkpoint-052_Source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: nova-indir-full-build
  cancel-in-progress: false

jobs:
  build:
    name: Nova İndir Lite + Pro + Google Play + Bağımsız
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SOURCE_ZIP: Nova-Indir-main_Checkpoint-052_Source.zip
      EXPECTED_SHA256: 97aec25ff635f47f0c835f0710589fabb65f43345ba155e1684d3134987abf5e
      GRADLE_OPTS: -Dfile.encoding=UTF-8

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: SHA-256 source verification
        shell: bash
        run: |
          set -euo pipefail

          test -f "$SOURCE_ZIP"

          ACTUAL_SHA256="$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')"

          echo "Beklenen SHA-256:"
          echo "$EXPECTED_SHA256"
          echo
          echo "Gerçek SHA-256:"
          echo "$ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Source ZIP SHA-256 doğrulaması başarısız."
            exit 1
          fi

          echo "SHA-256 doğrulama BAŞARILI."

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$SOURCE_ZIP" -d "$GITHUB_WORKSPACE/source"

          echo "Kaynak ZIP açıldı."

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_GRADLE="$(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              -name "gradlew" \
              -print \
              | head -1
          )"

          if [ -z "$PROJECT_GRADLE" ]; then
            echo "::error::Android projesi bulunamadı. gradlew bulunamadı."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_GRADLE")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android proje dizini:"
          echo "$PROJECT_DIR"

      - name: source.ready
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          test -f "$PROJECT_DIR/gradlew"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "::error::settings.gradle veya settings.gradle.kts bulunamadı."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::app modülü bulunamadı."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "source.ready"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle version
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version

      - name: Check available Gradle tasks
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew tasks --all \
            --no-daemon \
            --console=plain \
            | tee "$GITHUB_WORKSPACE/gradle-tasks.txt"

      - name: Verify required build variants
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          TASKS="$GITHUB_WORKSPACE/gradle-tasks.txt"

          REQUIRED_TASKS=(
            "assembleIndependentLiteDebug"
            "assembleIndependentProDebug"
            "assemblePlayLiteDebug"
            "assemblePlayProDebug"
            "bundlePlayLiteRelease"
            "bundlePlayProRelease"
          )

          for TASK in "${REQUIRED_TASKS[@]}"; do
            if ! grep -q "$TASK" "$TASKS"; then
              echo "::error::Gerekli Gradle task bulunamadı: $TASK"
              exit 1
            fi

            echo "OK: $TASK"
          done

      - name: Validate Room schema files
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          SCHEMA_DIR="app/schemas"

          if [ ! -d "$SCHEMA_DIR" ]; then
            echo "Room schema dizini bulunamadı."
            exit 0
          fi

          python3 - "$SCHEMA_DIR" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          errors = []

          for path in sorted(root.rglob("*.json")):
              try:
                  with path.open("r", encoding="utf-8") as f:
                      json.load(f)
                  print(f"OK: {path}")
              except Exception as exc:
                  print(f"BOZUK: {path}")
                  print(f"HATA: {exc}")
                  errors.append(path)

          if errors:
              sys.exit(1)
          PY

      - name: Clean
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --console=plain

      - name: Build APK variants
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleIndependentLiteDebug \
            :app:assembleIndependentProDebug \
            :app:assemblePlayLiteDebug \
            :app:assemblePlayProDebug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --console=plain

      - name: Inspect APK outputs
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh "{}" \;

      - name: Prepare APK artifacts
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/artifacts"

          mkdir -p \
            "$GITHUB_WORKSPACE/artifacts/Nova İndir Bağımsız Lite APK" \
            "$GITHUB_WORKSPACE/artifacts/Nova İndir Bağımsız Pro APK" \
            "$GITHUB_WORKSPACE/artifacts/Nova İndir Google Play Lite APK" \
            "$GITHUB_WORKSPACE/artifacts/Nova İndir Google Play Pro APK"

          python3 <<'PY'
          from pathlib import Path
          import shutil
          import os
          import re
          import sys

          root = Path("app/build/outputs/apk")

          variants = {
              "Nova İndir Bağımsız Lite APK": "independentlite",
              "Nova İndir Bağımsız Pro APK": "independentpro",
              "Nova İndir Google Play Lite APK": "playlite",
              "Nova İndir Google Play Pro APK": "playpro",
          }

          artifact_root = Path(os.environ["GITHUB_WORKSPACE"]) / "artifacts"

          apk_files = sorted(root.rglob("*.apk"))

          if not apk_files:
              print("HATA: APK bulunamadı.")
              sys.exit(1)

          def normalized(value):
              return re.sub(r"[^a-z0-9]", "", value.lower())

          for name, token in variants.items():

              matches = []

              for apk in apk_files:
                  relative = normalized(str(apk.relative_to(root)))

                  if token in relative:
                      matches.append(apk)

              print(f"{name} adayları:")

              for match in matches:
                  print(f"  {match}")

              if len(matches) != 1:
                  print(
                      f"HATA: {name} için tam olarak 1 APK bekleniyor. "
                      f"Bulunan: {len(matches)}"
                  )
                  sys.exit(1)

              source = matches[0]

              target_dir = artifact_root / name
              target = target_dir / f"{name}.apk"

              shutil.copy2(source, target)

              print(f"SEÇİLDİ: {source}")
              print(f"HEDEF:   {target}")

          print("APK artifact hazırlığı tamamlandı.")
          PY

      - name: Verify APK artifacts
        shell: bash
        run: |
          set -euo pipefail

          for DIR in \
            "Nova İndir Bağımsız Lite APK" \
            "Nova İndir Bağımsız Pro APK" \
            "Nova İndir Google Play Lite APK" \
            "Nova İndir Google Play Pro APK"
          do
            COUNT="$(
              find "$GITHUB_WORKSPACE/artifacts/$DIR" \
                -type f \
                -name "*.apk" \
                | wc -l
            )"

            echo "$DIR = $COUNT APK"

            if [ "$COUNT" -ne 1 ]; then
              echo "::error::$DIR içinde tam olarak 1 APK olmalı."
              exit 1
            fi
          done

      - name: Upload Nova İndir Bağımsız Lite APK
        uses: actions/upload-artifact@v6
        with:
          name: Nova İndir Bağımsız Lite APK
          path: artifacts/Nova İndir Bağımsız Lite APK/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Nova İndir Bağımsız Pro APK
        uses: actions/upload-artifact@v6
        with:
          name: Nova İndir Bağımsız Pro APK
          path: artifacts/Nova İndir Bağımsız Pro APK/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Nova İndir Google Play Lite APK
        uses: actions/upload-artifact@v6
        with:
          name: Nova İndir Google Play Lite APK
          path: artifacts/Nova İndir Google Play Lite APK/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Nova İndir Google Play Pro APK
        uses: actions/upload-artifact@v6
        with:
          name: Nova İndir Google Play Pro APK
          path: artifacts/Nova İndir Google Play Pro APK/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Google Play Lite AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:bundlePlayLiteRelease \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --console=plain

      - name: Build Google Play Pro AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:bundlePlayProRelease \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --console=plain

      - name: Inspect AAB outputs
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          find app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            -print \
            -exec ls -lh "{}" \;

      - name: Prepare AAB artifacts
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/aab-artifacts"

          mkdir -p \
            "$GITHUB_WORKSPACE/aab-artifacts/Nova İndir Google Play Lite AAB" \
            "$GITHUB_WORKSPACE/aab-artifacts/Nova İndir Google Play Pro AAB"

          python3 <<'PY'
          from pathlib import Path
          import shutil
          import os
          import re
          import sys

          root = Path("app/build/outputs/bundle")

          variants = {
              "Nova İndir Google Play Lite AAB": "playlite",
              "Nova İndir Google Play Pro AAB": "playpro",
          }

          artifact_root = (
              Path(os.environ["GITHUB_WORKSPACE"]) / "aab-artifacts"
          )

          aab_files = sorted(root.rglob("*.aab"))

          if not aab_files:
              print("HATA: AAB bulunamadı.")
              sys.exit(1)

          def normalized(value):
              return re.sub(r"[^a-z0-9]", "", value.lower())

          for name, token in variants.items():

              matches = []

              for aab in aab_files:
                  relative = normalized(str(aab.relative_to(root)))

                  if token in relative:
                      matches.append(aab)

              print(f"{name} adayları:")

              for match in matches:
                  print(f"  {match}")

              if len(matches) != 1:
                  print(
                      f"HATA: {name} için tam olarak 1 AAB bekleniyor. "
                      f"Bulunan: {len(matches)}"
                  )
                  sys.exit(1)

              source = matches[0]

              target_dir = artifact_root / name
              target = target_dir / f"{name}.aab"

              shutil.copy2(source, target)

              print(f"SEÇİLDİ: {source}")
              print(f"HEDEF:   {target}")

          print("AAB artifact hazırlığı tamamlandı.")
          PY

      - name: Verify AAB artifacts
        shell: bash
        run: |
          set -euo pipefail

          for DIR in \
            "Nova İndir Google Play Lite AAB" \
            "Nova İndir Google Play Pro AAB"
          do
            COUNT="$(
              find "$GITHUB_WORKSPACE/aab-artifacts/$DIR" \
                -type f \
                -name "*.aab" \
                | wc -l
            )"

            echo "$DIR = $COUNT AAB"

            if [ "$COUNT" -ne 1 ]; then
              echo "::error::$DIR içinde tam olarak 1 AAB olmalı."
              exit 1
            fi
          done

      - name: Upload Nova İndir Google Play Lite AAB
        uses: actions/upload-artifact@v6
        with:
          name: Nova İndir Google Play Lite AAB
          path: aab-artifacts/Nova İndir Google Play Lite AAB/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Nova İndir Google Play Pro AAB
        uses: actions/upload-artifact@v6
        with:
          name: Nova İndir Google Play Pro AAB
          path: aab-artifacts/Nova İndir Google Play Pro AAB/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Final SHA-256 report
        if: always()
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "NOVA İNDİR BUILD OUTPUT"
          echo "=========================================="
          echo

          if [ -d "$GITHUB_WORKSPACE/artifacts" ]; then
            find "$GITHUB_WORKSPACE/artifacts" \
              -type f \
              -name "*.apk" \
              -exec sha256sum "{}" \; \
              -exec ls -lh "{}" \;
          fi

          echo

          if [ -d "$GITHUB_WORKSPACE/aab-artifacts" ]; then
            find "$GITHUB_WORKSPACE/aab-artifacts" \
              -type f \
              -name "*.aab" \
              -exec sha256sum "{}" \; \
              -exec ls -lh "{}" \;
          fi

          echo
          echo "=========================================="
