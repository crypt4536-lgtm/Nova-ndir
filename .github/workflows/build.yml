name: Nova İndir Tam Derleme

on:
  workflow_dispatch:
    inputs:
      hedef:
        description: "Derlenecek hedef"
        required: true
        default: "tümü"
        type: choice
        options:
          - "tümü"
          - "bağımsız"
          - "google-play"

permissions:
  contents: read

concurrency:
  group: nova-indir-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Nova İndir Lite + Pro + Google Play + Bağımsız
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SOURCE_ZIP: Nova-Indir-main_Checkpoint-052_Source.zip
      EXPECTED_SHA256: 97aec25ff635f47f0c835f0710589fabb65f43345ba155e1684d3134987abf5e
      GRADLE_OPTS: "-Dfile.encoding=UTF-8"
      HEDEF: ${{ inputs.hedef }}
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk

    steps:
      - name: Kaynağı al
        uses: actions/checkout@v5

      - name: ZIP SHA-256 doğrulaması
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP" || { echo "::error::Kaynak ZIP bulunamadı: $SOURCE_ZIP"; exit 1; }
          ACTUAL_SHA256="$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')"
          echo "Beklenen SHA-256: $EXPECTED_SHA256"
          echo "Gerçek SHA-256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || { echo "::error::Source ZIP SHA-256 doğrulaması başarısız."; exit 1; }
          echo "SHA-256 doğrulaması BAŞARILI."

      - name: Kaynak ZIP'i aç
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$SOURCE_ZIP" -d "$GITHUB_WORKSPACE/source"

      - name: Android projesini bul
        id: project
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find "$GITHUB_WORKSPACE/source" -type f -name gradlew -print -quit)"
          test -n "$GRADLEW" || { echo "::error::Kaynak ZIP içinde gradlew bulunamadı."; exit 1; }
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "Android proje dizini: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$PROJECT_DIR/gradlew"
          test -d "$PROJECT_DIR/app" || { echo "::error::Android app klasörü bulunamadı."; exit 1; }

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK araçlarını kur
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL -o "$RUNNER_TEMP/commandlinetools.zip" https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
            rm -rf "$SDK_ROOT/cmdline-tools/latest" "$RUNNER_TEMP/android-cmdline-tools"
            mkdir -p "$SDK_ROOT/cmdline-tools/latest" "$RUNNER_TEMP/android-cmdline-tools"
            unzip -q "$RUNNER_TEMP/commandlinetools.zip" -d "$RUNNER_TEMP/android-cmdline-tools"
            mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools"/* "$SDK_ROOT/cmdline-tools/latest/"
          fi
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36"
          echo "Android SDK hazır."
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E 'platform-tools|platforms;android-36' || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version

      - name: Gradle tasklarını keşfet
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:tasks --all --no-daemon --console=plain > "$GITHUB_WORKSPACE/gradle-tasks.txt"
          echo "================================"
          echo "KEŞFEDİLEN NOVA TASKLARI"
          echo "================================"
          grep -E '^[[:space:]]*(assemble|bundle|build)[A-Za-z0-9]+' "$GITHUB_WORKSPACE/gradle-tasks.txt" | grep -Ei 'Nova|nova' || true
          mapfile -t NOVA_TASKS < <(sed -nE 's/^[[:space:]]*((assemble|bundle|build)[A-Za-z0-9]+)([[:space:]]+-.*)?$/\1/p' "$GITHUB_WORKSPACE/gradle-tasks.txt" | grep -Ei 'Nova' | sort -u)
          test "${#NOVA_TASKS[@]}" -gt 0 || { echo "::error::Gradle task listesinde Nova ile eşleşen build taskı bulunamadı."; cat "$GITHUB_WORKSPACE/gradle-tasks.txt"; exit 1; }
          printf '%s\n' "${NOVA_TASKS[@]}" > "$GITHUB_WORKSPACE/nova-tasks.txt"

      - name: Gradle task eşleşmelerini göster
        shell: bash
        run: |
          set -euo pipefail
          echo "HEDEF: $HEDEF"
          echo "Tüm Nova taskları:"
          cat "$GITHUB_WORKSPACE/nova-tasks.txt"

      - name: Room schema dosyalarını temizle
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "app/schemas" ]; then find app/schemas -type f -name "*.json" -print -delete; else echo "app/schemas bulunamadı."; fi

      - name: Release imza kontrolü
        id: signing
        shell: bash
        env:
          NOVA_KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_B64 }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${NOVA_KEYSTORE_B64:-}" ] && [ -n "${NOVA_KEY_ALIAS:-}" ] && [ -n "${NOVA_STORE_PASSWORD:-}" ] && [ -n "${NOVA_KEY_PASSWORD:-}" ]; then
            umask 077
            KEYSTORE_PATH="$RUNNER_TEMP/nova-release.keystore"
            printf '%s' "$NOVA_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"

            echo "Keystore doğrulanıyor..."
            keytool -list -keystore "$KEYSTORE_PATH" -storepass "$NOVA_STORE_PASSWORD" >/dev/null
            keytool -list -keystore "$KEYSTORE_PATH" -storepass "$NOVA_STORE_PASSWORD" -alias "$NOVA_KEY_ALIAS" >/dev/null
            echo "Keystore ve alias doğrulaması BAŞARILI."

            # build.gradle.kts reads these values from the process environment.
            # GITHUB_ENV makes them available to every later workflow step.
            echo "NOVA_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "NOVA_KEY_ALIAS=$NOVA_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "NOVA_STORE_PASSWORD=$NOVA_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "NOVA_KEY_PASSWORD=$NOVA_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Release signing hazır ve sonraki Gradle adımlarına aktarıldı."
          else
            echo "::warning::Release signing secretları eksik. Debug/test çıktıları üretilecek."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: ./gradlew clean --no-daemon --max-workers=1 --stacktrace --console=plain

      - name: Tüm sürümleri derle
        if: ${{ inputs.hedef == 'tümü' }}
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.ready }}" = "true" ]; then
            test -n "${NOVA_KEYSTORE:-}" || { echo "::error::NOVA_KEYSTORE Gradle adımına aktarılmadı."; exit 1; }
            test -n "${NOVA_KEY_ALIAS:-}" || { echo "::error::NOVA_KEY_ALIAS Gradle adımına aktarılmadı."; exit 1; }
            test -n "${NOVA_STORE_PASSWORD:-}" || { echo "::error::NOVA_STORE_PASSWORD Gradle adımına aktarılmadı."; exit 1; }
            test -n "${NOVA_KEY_PASSWORD:-}" || { echo "::error::NOVA_KEY_PASSWORD Gradle adımına aktarılmadı."; exit 1; }
            test -f "$NOVA_KEYSTORE" || { echo "::error::NOVA_KEYSTORE dosyası bulunamadı."; exit 1; }
            echo "Canonical distribution task: buildNovaDistributionRelease"
            ./gradlew :app:buildNovaDistributionRelease --no-daemon --max-workers=1 --stacktrace --console=plain
          else
            echo "::error::Release signing olmadan 'tümü' hedefi çalıştırılamaz. Release çıktıları için dört signing secret'ı sağlayın."
            exit 1
          fi

      - name: Yalnız Bağımsız derle
        if: ${{ inputs.hedef == 'bağımsız' }}
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.ready }}" = "true" ]; then
            ./gradlew :app:assembleNovaIndependentRelease --no-daemon --max-workers=1 --stacktrace --console=plain
          else
            ./gradlew :app:assembleNovaIndependentDebug --no-daemon --max-workers=1 --stacktrace --console=plain
          fi

      - name: Yalnız Google Play derle
        if: ${{ inputs.hedef == 'google-play' }}
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.ready }}" = "true" ]; then
            ./gradlew :app:bundleNovaPlayRelease --no-daemon --max-workers=1 --stacktrace --console=plain
          else
            ./gradlew :app:exportNovaPlayDebugApks --no-daemon --max-workers=1 --stacktrace --console=plain
          fi

      - name: Build çıktılarını göster
        if: always()
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo "APK:"
          find app/build/outputs/apk -type f -name "*.apk" -print 2>/dev/null || true
          echo "AAB:"
          find app/build/outputs/bundle -type f -name "*.aab" -print 2>/dev/null || true
          echo "Nova dağıtım klasörleri:"
          find . -maxdepth 3 -type d \( -name "Nova*Google Play*" -o -name "Nova*Bağımsız*" \) -print 2>/dev/null || true

      - name: Geçici imza dosyasını temizle
        if: always()
        shell: bash
        run: rm -f "${NOVA_KEYSTORE:-}" || true
