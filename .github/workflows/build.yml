name: Nova İndir Dağıtım Derlemesi

on:
  workflow_dispatch:
    inputs:
      hedef:
        description: "Derlenecek dağıtım"
        required: true
        default: "tümü"
        type: choice
        options:
          - "tümü"
          - "bağımsız"
          - "google-play"

  push:
    branches:
      - main
    paths:
      - "Nova-Indir-main_Checkpoint-052_Source.zip"
      - ".github/workflows/nova-build.yml"
      - ".github/NOVA_BUILD_NOW"

permissions:
  contents: write

concurrency:
  group: nova-indir-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Nova İndir Lite + Pro + Google Play + Bağımsız
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SOURCE_ZIP: Nova-Indir-main_Checkpoint-052_Source.zip

      # Bu yüklediğin ZIP'in SHA-256 değeri
      EXPECTED_SHA256: 97aec25ff635f47f0c835f0710589fabb65f43345ba155e1684d3134987abf5e

      GRADLE_OPTS: "-Dfile.encoding=UTF-8"

      NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
      NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
      NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}

      NOVA_PLAY_PRIVACY_URL: ${{ vars.NOVA_PLAY_PRIVACY_URL }}
      NOVA_INDEPENDENT_PRIVACY_URL: ${{ vars.NOVA_INDEPENDENT_PRIVACY_URL }}

      NOVA_UPDATE_MANIFEST_URL_FULL: ${{ vars.NOVA_UPDATE_MANIFEST_URL_FULL }}
      NOVA_UPDATE_MANIFEST_URL_LITE: ${{ vars.NOVA_UPDATE_MANIFEST_URL_LITE }}

      NOVA_UPDATE_PUBLIC_KEY_B64: ${{ secrets.NOVA_UPDATE_PUBLIC_KEY_B64 }}

      NOVA_PLAY_DISPENSER_URL: ${{ vars.NOVA_PLAY_DISPENSER_URL }}

    steps:

      # ============================================================
      # 1. REPOSITORY
      # ============================================================

      - name: Kaynağı al
        uses: actions/checkout@v6

      # ============================================================
      # 2. SHA-256 DOĞRULAMA
      # ============================================================

      - name: Source ZIP SHA-256 doğrulaması
        shell: bash
        run: |
          set -euo pipefail

          echo "Kaynak ZIP:"
          echo "$SOURCE_ZIP"
          echo

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::Kaynak ZIP bulunamadı: $SOURCE_ZIP"
            exit 1
          fi

          ACTUAL_SHA256="$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')"

          echo "Beklenen SHA-256:"
          echo "$EXPECTED_SHA256"
          echo

          echo "Gerçek SHA-256:"
          echo "$ACTUAL_SHA256"
          echo

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Source ZIP SHA-256 doğrulaması başarısız."
            exit 1
          fi

          echo "SHA-256 doğrulaması BAŞARILI."

      # ============================================================
      # 3. SOURCE READY
      # ============================================================

      - name: Source ZIP'i aç
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/source"

          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/source"

          echo "Kaynak ZIP başarıyla açıldı."

      - name: Android projesini bul
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(
            find "$GITHUB_WORKSPACE/source" \
              -type f \
              -name "gradlew" \
              -print \
              | head -1
          )"

          if [ -z "$GRADLEW" ]; then
            echo "::error::Kaynak içinde gradlew bulunamadı."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo
          echo "Android proje dizini:"
          echo "$PROJECT_DIR"

      - name: source.ready
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          test -f "$PROJECT_DIR/gradlew"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "::error::settings.gradle(.kts) bulunamadı."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::app modülü bulunamadı."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo
          echo "=========================================="
          echo "source.ready"
          echo "=========================================="

      # ============================================================
      # 4. JAVA
      # ============================================================

      - name: Java 17 hazırla
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Android SDK hazırla
        uses: android-actions/setup-android@v3

      - name: Android API 36 ve Build Tools hazırla
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      # ============================================================
      # 6. GRADLE
      # ============================================================

      - name: Gradle önbelleğini hazırla
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Wrapper çalıştırma izni
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

      - name: Gradle sürümünü göster
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --version

      # ============================================================
      # 7. TASK KONTROLÜ
      # ============================================================

      - name: Nova build tasklarını doğrula
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew tasks --all \
            --no-daemon \
            --console=plain \
            | tee "$GITHUB_WORKSPACE/gradle-tasks.txt"

          REQUIRED_TASKS=(
            "assembleNovaPlayDebug"
            "bundleNovaPlayRelease"
            "assembleNovaIndependentDebug"
            "assembleNovaIndependentRelease"
            "buildNovaDistributionRelease"
          )

          for TASK in "${REQUIRED_TASKS[@]}"; do
            if ! grep -q "$TASK" "$GITHUB_WORKSPACE/gradle-tasks.txt"; then
              echo "::error::Gerekli Nova Gradle task bulunamadı: $TASK"
              exit 1
            fi

            echo "OK: $TASK"
          done

          echo
          echo "Gerekli Nova build taskları mevcut."

      # ============================================================
      # 8. ROOM SCHEMA KONTROLÜ
      # ============================================================

      - name: Room schema JSON doğrulaması
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          SCHEMA_DIR="app/schemas"

          if [ ! -d "$SCHEMA_DIR" ]; then
            echo "app/schemas bulunamadı."
            echo "Room schema kontrolü atlanıyor."
            exit 0
          fi

          python3 - "$SCHEMA_DIR" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          errors = []

          for path in sorted(root.rglob("*.json")):
              try:
                  with path.open("r", encoding="utf-8") as f:
                      json.load(f)

                  print(f"OK: {path}")

              except Exception as exc:
                  print(f"BOZUK: {path}")
                  print(f"HATA: {exc}")
                  errors.append(path)

          if errors:
              print()
              print("Room schema JSON hataları bulundu.")
              sys.exit(1)

          print()
          print("Room schema JSON kontrolü BAŞARILI.")
          PY

      # ============================================================
      # 9. RELEASE SIGNING DURUMU
      # ============================================================

      - name: Release imza durumunu belirle
        id: signing
        shell: bash
        env:
          NOVA_KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [ -n "${NOVA_KEYSTORE_B64:-}" ] && \
             [ -n "${NOVA_KEY_ALIAS:-}" ] && \
             [ -n "${NOVA_STORE_PASSWORD:-}" ] && \
             [ -n "${NOVA_KEY_PASSWORD:-}" ]; then

            echo "ready=true" >> "$GITHUB_OUTPUT"

            echo "Release imza secret'ları hazır."

          else

            echo "ready=false" >> "$GITHUB_OUTPUT"

            echo "::warning::Release imza secret'ları eksik."
            echo "::warning::Debug/test APK derlemesi yapılacak."

          fi

      # ============================================================
      # 10. KEYSTORE
      # ============================================================

      - name: Release imzasını hazırla
        if: ${{ steps.signing.outputs.ready == 'true' }}
        shell: bash
        env:
          NOVA_KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          umask 077

          KEYSTORE_PATH="$RUNNER_TEMP/nova-release.keystore"

          printf '%s' "$NOVA_KEYSTORE_B64" \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          echo "NOVA_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Release keystore hazır."

      # ============================================================
      # 11. TEMİZ DERLEME
      # ============================================================

      - name: Clean
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --console=plain

      # ============================================================
      # 12. GERÇEK RELEASE BUILD
      #
      # Kaynakta gerçekten bulunan özel task:
      # buildNovaDistributionRelease
      #
      # Bunun altında:
      # bundleNovaPlayRelease
      # assembleNovaIndependentRelease
      #
      # çalışıyor.
      # ============================================================

      - name: Gerçek Nova dağıtım derlemesi
        if: ${{ steps.signing.outputs.ready == 'true' && (github.event_name == 'push' || inputs.hedef == 'tümü') }}
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:buildNovaDistributionRelease \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --console=plain

      # ============================================================
      # 13. SADECE BAĞIMSIZ
      # ============================================================

      - name: Bağımsız Lite + Pro release APK
        if: ${{ steps.signing.outputs.ready == 'true' && inputs.hedef == 'bağımsız' }}
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            :app:assembleNovaIndependentRelease \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --console=plain

      # ============================================================
      # 14. SADECE GOOGLE PLAY
      # ============================================================

      - name: Google Play Lite + Pro AAB
        if: ${{ steps.signing.outputs.ready == 'true' && inputs.hedef == 'google-play' }}
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            :app:bundleNovaPlayRelease \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --console=plain

      # ============================================================
      # 15. SIGNING YOKSA DEBUG BUILD
      # ============================================================

      - name: İmza yoksa Bağımsız + Google Play debug APK
        if: ${{ steps.signing.outputs.ready != 'true' && (github.event_name == 'push' || inputs.hedef == 'tümü') }}
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleNovaPlayDebug \
            :app:assembleNovaIndependentDebug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --console=plain

      # ============================================================
      # 16. BAĞIMSIZ DEBUG
      # ============================================================

      - name: Bağımsız debug APK
        if: ${{ steps.signing.outputs.ready != 'true' && inputs.hedef == 'bağımsız' }}
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            :app:assembleNovaIndependentDebug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --console=plain

      # ============================================================
      # 17. GOOGLE PLAY DEBUG
      # ============================================================

      - name: Google Play debug APK
        if: ${{ steps.signing.outputs.ready != 'true' && inputs.hedef == 'google-play' }}
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            :app:assembleNovaPlayDebug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --console=plain

      # ============================================================
      # 18. OUTPUT KONTROLÜ
      # ============================================================

      - name: Build çıktılarını göster
        if: always()
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "APK OUTPUTS"
          echo "=========================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh "{}" \; \
            2>/dev/null || true

          echo
          echo "=========================================="
          echo "AAB OUTPUTS"
          echo "=========================================="

          find app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            -print \
            -exec ls -lh "{}" \; \
            2>/dev/null || true

          echo
          echo "=========================================="
          echo "NOVA OUTPUT DIRECTORIES"
          echo "=========================================="

          find . \
            -maxdepth 3 \
            -type d \
            \( \
              -name "Nova İndir * Google Play" \
              -o \
              -name "Nova İndir * Bağımsız" \
            \) \
            -print \
            2>/dev/null || true

      # ============================================================
      # 19. EXACT RELEASE ARTIFACT KONTROLÜ
      # ============================================================

      - name: Release çıktılarının tekilliğini doğrula
        if: ${{ steps.signing.outputs.ready == 'true' && (github.event_name == 'push' || inputs.hedef == 'tümü') }}
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          PLAY_DIR="$(find . -maxdepth 2 -type d -name '* Google Play' | head -1)"
          INDEPENDENT_DIR="$(find . -maxdepth 2 -type d -name '* Bağımsız' | head -1)"

          if [ -z "$PLAY_DIR" ]; then
            echo "::error::Google Play çıktı klasörü bulunamadı."
            exit 1
          fi

          if [ -z "$INDEPENDENT_DIR" ]; then
            echo "::error::Bağımsız çıktı klasörü bulunamadı."
            exit 1
          fi

          echo "Google Play:"
          find "$PLAY_DIR" \
            -type f \
            -name "*.aab" \
            -print \
            -exec ls -lh "{}" \;

          echo
          echo "Bağımsız:"
          find "$INDEPENDENT_DIR" \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh "{}" \;

          PLAY_COUNT="$(find "$PLAY_DIR" -type f -name '*.aab' | wc -l)"
          INDEPENDENT_COUNT="$(find "$INDEPENDENT_DIR" -type f -name '*.apk' | wc -l)"

          if [ "$PLAY_COUNT" -ne 2 ]; then
            echo "::error::Google Play tarafında tam olarak 2 AAB bekleniyor. Bulunan: $PLAY_COUNT"
            exit 1
          fi

          if [ "$INDEPENDENT_COUNT" -ne 2 ]; then
            echo "::error::Bağımsız tarafında tam olarak 2 APK bekleniyor. Bulunan: $INDEPENDENT_COUNT"
            exit 1
          fi

          echo
          echo "Release çıktı kontrolü BAŞARILI."

      # ============================================================
      # 20. GOOGLE PLAY AAB ARTIFACT
      # ============================================================

      - name: Google Play AAB yükle
        if: ${{ steps.signing.outputs.ready == 'true' && (github.event_name == 'push' || inputs.hedef == 'tümü' || inputs.hedef == 'google-play') }}
        uses: actions/upload-artifact@v6
        with:
          name: Nova İndir Google Play AAB
          path: |
            ${{ steps.project.outputs.project_dir }}/Nova İndir * Google Play/*.aab
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 21. BAĞIMSIZ APK ARTIFACT
      # ============================================================

      - name: Bağımsız APK yükle
        if: ${{ steps.signing.outputs.ready == 'true' && (github.event_name == 'push' || inputs.hedef == 'tümü' || inputs.hedef == 'bağımsız') }}
        uses: actions/upload-artifact@v6
        with:
          name: Nova İndir Bağımsız APK
          path: |
            ${{ steps.project.outputs.project_dir }}/Nova İndir * Bağımsız/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 22. DEBUG GOOGLE PLAY
      # ============================================================

      - name: Google Play debug APK yükle
        if: ${{ steps.signing.outputs.ready != 'true' && (github.event_name == 'push' || inputs.hedef == 'tümü' || inputs.hedef == 'google-play') }}
        uses: actions/upload-artifact@v6
        with:
          name: Nova İndir Google Play Test APK
          path: |
            ${{ steps.project.outputs.project_dir }}/Nova İndir * Google Play Test/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 23. DEBUG BAĞIMSIZ
      # ============================================================

      - name: Bağımsız debug APK yükle
        if: ${{ steps.signing.outputs.ready != 'true' && (github.event_name == 'push' || inputs.hedef == 'tümü' || inputs.hedef == 'bağımsız') }}
        uses: actions/upload-artifact@v6
        with:
          name: Nova İndir Bağımsız Test APK
          path: |
            ${{ steps.project.outputs.project_dir }}/Nova İndir * Bağımsız Test/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 24. SHA-256 RAPORU
      # ============================================================

      - name: Çıktı SHA-256 raporu
        if: always()
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "NOVA İNDİR SHA-256"
          echo "=========================================="

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -path "./Nova İndir *" \
            -exec sha256sum "{}" \; \
            2>/dev/null || true

          echo
          echo "Build tamamlandı."

      # ============================================================
      # 25. GEÇİCİ KEYSTORE TEMİZLİĞİ
      # ============================================================

      - name: Geçici keystore'u sil
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nova-release.keystore" || true
