      - name: Çıktıları Lite Pro olarak ayır
        if: success()
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/nova-artifacts"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          python3 - "$OUT" <<'PY'
          from pathlib import Path
          import sys
          import shutil
          import re

          out = Path(sys.argv[1])
          project = Path(".").resolve()

          apk_root = project / "app" / "build" / "outputs" / "apk"
          aab_root = project / "app" / "build" / "outputs" / "bundle"

          apk_files = sorted(apk_root.rglob("*.apk")) if apk_root.exists() else []
          aab_files = sorted(aab_root.rglob("*.aab")) if aab_root.exists() else []

          def norm(path):
              return re.sub(r"[^a-z0-9]", "", str(path).lower())

          def select(files, extension, tokens):
              candidates = [
                  p for p in files
                  if p.suffix.lower() == extension
                  and all(token in norm(p) for token in tokens)
              ]

              if not candidates:
                  return None

              # Öncelik:
              # 1. universal
              # 2. arm64-v8a
              # 3. armeabi-v7a
              priority = (
                  "universal",
                  "arm64v8a",
                  "armeabiv7a",
                  "x86_64",
                  "x86",
              )

              for wanted in priority:
                  preferred = [
                      p for p in candidates
                      if wanted in norm(p)
                  ]

                  if preferred:
                      return preferred[0]

              # Hiçbir ABI adı eşleşmezse ilk deterministic çıktı
              return candidates[0]

          targets = [
              (
                  "Nova İndir Bağımsız Lite APK",
                  ".apk",
                  ("independent", "lite"),
              ),
              (
                  "Nova İndir Bağımsız Pro APK",
                  ".apk",
                  ("independent", "pro"),
              ),
              (
                  "Nova İndir Google Play Lite APK",
                  ".apk",
                  ("play", "lite"),
              ),
              (
                  "Nova İndir Google Play Pro APK",
                  ".apk",
                  ("play", "pro"),
              ),
              (
                  "Nova İndir Google Play Lite AAB",
                  ".aab",
                  ("play", "lite"),
              ),
              (
                  "Nova İndir Google Play Pro AAB",
                  ".aab",
                  ("play", "pro"),
              ),
          ]

          found = 0

          for name, extension, tokens in targets:
              source = select(
                  apk_files if extension == ".apk" else aab_files,
                  extension,
                  tokens,
              )

              if source is None:
                  print(f"YOK: {name}")
                  continue

              destination_dir = out / name
              destination_dir.mkdir(parents=True, exist_ok=True)

              destination = destination_dir / f"{name}{extension}"

              shutil.copy2(source, destination)

              print(f"OK: {name}")
              print(f"    Kaynak : {source}")
              print(f"    Çıktı  : {destination}")

              found += 1

          if found == 0:
              print("ERROR: Hiçbir APK/AAB çıktısı bulunamadı.")
              sys.exit(1)

          print()
          print(f"Toplam artifact grubu: {found}")
          PY
