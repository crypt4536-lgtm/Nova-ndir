name: 053 DEX Denetim Düzeltmesi

on:
  push:
    branches:
      - nova053-build
    paths:
      - '.github/workflows/fix053audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: nova053-build
          fetch-depth: 0

      - name: DEX denetimini düzelt
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > "$RUNNER_TEMP/fix053.py"
          python3 "$RUNNER_TEMP/fix053.py"
          git diff --check
          git diff -- .github/workflows/release053.yml

      - name: Düzeltmeyi dala yaz
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release053.yml
          git commit -m 'Fix 053 DEX class isolation validation'
          git push origin HEAD:nova053-build
