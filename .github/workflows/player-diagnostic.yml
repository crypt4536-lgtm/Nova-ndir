name: Nova Player Kaynak Tanılama

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/player-diagnostic.yml'

permissions:
  contents: read

jobs:
  player-chain:
    name: Nova Player URI zincirini çıkar
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Checkpoint 052 kaynak ZIP'ini doğrula
        shell: bash
        run: |
          set -euo pipefail
          test -f "Nova-Indir-main_Checkpoint-052_Source.zip"
          sha256sum "Nova-Indir-main_Checkpoint-052_Source.zip"

      - name: Kaynak ZIP'ini aç
        shell: bash
        run: |
          set -euo pipefail
          rm -rf playerdiag
          mkdir -p playerdiag/source playerdiag/output/files
          unzip -q "Nova-Indir-main_Checkpoint-052_Source.zip" -d playerdiag/source

      - name: Player URI zincirini tara
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path("playerdiag/source")
          out = Path("playerdiag/output")
          files_out = out / "files"

          wanted_names = {
              "PlayerActivity.kt",
              "MainActivity.kt",
              "GalleryActivity.kt",
              "GalleryAdapter.kt",
              "DownloadAdapter.kt",
              "HistoryStore.kt",
              "StoredDownload.kt",
              "StorageHelper.kt",
              "DownloadRepository.kt",
              "CompletionEventStore.kt",
              "DownloadService.kt",
              "YtDlpDownloadService.kt",
              "AndroidManifest.xml",
              "build.gradle.kts",
              "proguard-rules.pro",
              "gradle.properties",
          }

          copied = []
          for path in root.rglob("*"):
              if not path.is_file() or path.name not in wanted_names:
                  continue
              rel = path.relative_to(root)
              target = files_out / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, target)
              copied.append(rel)

          patterns = [
              r"PlayerActivity",
              r"EXTRA_OUTPUT_URI",
              r"outputUri",
              r"HistoryStore",
              r"StoredDownload",
              r"StorageHelper",
              r"renameOutput",
              r"renameDownloaded",
              r"MediaStore",
              r"ACTION_VIEW",
              r"startActivity",
              r"openExternal",
              r"openFileDescriptor",
              r"MediaItem\.fromUri",
              r"setMediaItem",
          ]
          rx = re.compile("|".join(patterns), re.IGNORECASE)
          text_ext = {".kt", ".kts", ".java", ".xml", ".pro", ".properties"}

          hits = []
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in text_ext:
                  continue
              try:
                  lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
              except Exception:
                  continue
              rel = path.relative_to(root)
              for lineno, line in enumerate(lines, start=1):
                  if rx.search(line):
                      hits.append((str(rel), lineno, line.strip()))

          report = []
          report.append("Nova Player Checkpoint 052 URI Chain Diagnostic")
          report.append("================================================")
          report.append(f"Selected full files copied: {len(copied)}")
          report.append(f"Chain matches: {len(hits)}")
          report.append("")
          report.append("FULL FILES")
          report.append("----------")
          report.extend(str(p) for p in sorted(copied, key=lambda p: str(p).lower()))
          report.append("")
          report.append("CHAIN MATCHES")
          report.append("-------------")
          for rel, lineno, line in hits:
              report.append(f"{rel}:{lineno}: {line[:800]}")

          text = "\n".join(report)
          (out / "NovaPlayerUriChain.txt").write_text(text, encoding="utf-8")
          print(text)

          required = {"PlayerActivity.kt", "HistoryStore.kt", "StorageHelper.kt"}
          found = {Path(p).name for p in copied}
          missing = sorted(required - found)
          if missing:
              raise SystemExit("Eksik kritik kaynaklar: " + ", ".join(missing))
          PY

      - name: URI zinciri tanılama çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: nova-player-uri-chain
          path: playerdiag/output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
